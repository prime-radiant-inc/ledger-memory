name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ledger (released binary)
        run: |
          curl -fsSL https://github.com/prime-radiant-inc/ledger/releases/latest/download/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure git identity (ledger commits need one)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  everyharness-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build everyharness
        run: |
          git clone --depth 1 https://github.com/prime-radiant-inc/everyharness /tmp/everyharness
          cd /tmp/everyharness && npm ci --silent && npm run build --silent
      - name: Validate generated manifests
        run: node /tmp/everyharness/dist/cli.js validate
